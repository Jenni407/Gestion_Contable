services:
  backend:
    build:
      context: ./backend/gestionClientes
    image: gestion-contable-backend
    container_name: gestion-backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio. Define las variables en un archivo .env}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-OficinaSecret123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:5173}
      DB_URL: ${DB_URL:-jdbc:sqlite:BD/servicio_contable.db}
    volumes:
      # Persistencia de la base de datos SQLite y de los comprobantes PDF
      - ./data/db:/app/BD
      - ./data/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend-gestion
      args:
        VITE_API_URL: /api
    image: gestion-contable-frontend
    container_name: gestion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Expone nginx en el host; Caddy (contenedor centralizado) apunta aquí
      - "8081:80"
