#nombre de la aplicación
spring.application.name=gestionClientes

#puerto del backend
server.port=8080

# Conexión a la BD (ruta relativa = se resuelve contra la carpeta de trabajo; al lanzar desde gestionClientes usa BD/servicio_contable.db)
spring.datasource.url=${DB_URL:jdbc:sqlite:BD/servicio_contable.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecto para que Hibernate entienda SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Servidor SMTP de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Cuenta emisora y Contraseña de Aplicación (sobrescribir con variables de entorno)
spring.mail.username=${GMAIL_USER:soporte.tecnico.gt058@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:dous lvuk ogcd ngdw}

# Protocolos de seguridad
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de JWT (sobrescribir app.jwt.secreto con variable de entorno en producción)
app.jwt.secreto=${JWT_SECRET:ClaveSecretaSuperSeguraParaRecuperacion12345!}
app.jwt.expiracionRecuperacionMs=900000
app.jwt.expiracionLoginMs=86400000