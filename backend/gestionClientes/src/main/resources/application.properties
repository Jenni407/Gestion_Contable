# Nombre de la aplicación
spring.application.name=gestionClientes

# Puerto del backend
server.port=${SERVER_PORT:8080}

# Conexión a la BD (ruta relativa = se resuelve contra la carpeta de trabajo; al lanzar desde gestionClientes usa BD/servicio_contable.db)
spring.datasource.url=${DB_URL:jdbc:sqlite:BD/servicio_contable.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecto para que Hibernate entienda SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Servidor SMTP de Gmail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# Cuenta emisora y Contraseña de Aplicación (definir por variables de entorno, NUNCA en el código)
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}

# Protocolos de seguridad
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# Configuración de JWT (obligatorio definir JWT_SECRET en producción)
app.jwt.secreto=${JWT_SECRET:}
app.jwt.expiracionRecuperacionMs=900000
app.jwt.expiracionLoginMs=86400000

# CORS: orígenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# URL pública del portal (usada en enlaces de correos)
app.portal.url=${PORTAL_URL:http://localhost:5173}
